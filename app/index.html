<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Radex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#050b14; --panel:#0b1626; --line:#17304a; --ice:#d9f4ff; --mute:#7a95ad;
    --cy:#4fd8ff; --amber:#ffb347; --err:#ff8a8a; --hi:#fff;
    --font:'Rajdhani','Segoe UI',system-ui,sans-serif;
    color-scheme:dark; box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  body[data-state=acting]{--cy:var(--amber)}
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{height:100%;margin:0}
  body{background:radial-gradient(ellipse at 50% 26%,#0c2036 0,var(--ink) 62%);color:var(--ice);font:500 18px/1.4 var(--font);display:flex;flex-direction:column;align-items:center;overflow:hidden}
  header{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:baseline;padding:16px 20px 0}
  h1{margin:0;font-weight:600;font-size:22px;letter-spacing:.32em;color:var(--cy)}
  #status{color:var(--mute);font-size:16px}
  #ver{color:var(--mute);font-size:14px;cursor:pointer;letter-spacing:.04em}
  #ver:hover{color:var(--cy)}

  .mini{background:none;border:1px solid var(--line);color:var(--ice);border-radius:8px;padding:3px 12px;font:inherit;font-size:15px;cursor:pointer}
  .mini:hover{border-color:var(--cy);color:var(--cy)}
  dialog#diag{background:var(--panel);color:var(--ice);border:1px solid var(--cy);border-radius:14px;padding:18px 20px;width:min(92vw,470px);font:500 16px/1.4 var(--font)}
  dialog#diag::backdrop{background:rgba(2,6,12,.72)}
  #diag h2{margin:0 0 8px;font-size:19px;color:var(--cy);letter-spacing:.06em}
  #diag .row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:8px 0}
  #diag select{background:var(--ink);color:var(--ice);border:1px solid var(--line);border-radius:8px;padding:4px 6px;font:inherit;max-width:270px}
  #diag .btns{flex-wrap:wrap;justify-content:flex-start;margin-top:12px}
  .dgbar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:12px 0 6px}
  .dgbar i{display:block;height:100%;width:0;background:var(--cy);transition:width .06s}
  #dgMsg{margin:6px 0}#dgOut{margin:6px 0;color:var(--amber);min-height:1.4em}
  .orb{width:min(36vmin,280px);aspect-ratio:1;position:relative;margin:2vh 0;display:grid;place-items:center;cursor:pointer;border-radius:50%;flex:none;border:0;background:none;padding:0}
  .orb:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--cy);outline-offset:3px}
  .ring{position:absolute;border-radius:50%}
  .r1{inset:0;border:2px solid transparent;border-top-color:var(--cy);border-bottom-color:var(--cy);animation:spin 10s linear infinite}
  .r2{inset:11%;border:2px dashed color-mix(in srgb,var(--cy) 55%,transparent);animation:spin 22s linear infinite reverse}
  .r3{inset:23%;border:4px solid transparent;border-left-color:var(--cy);border-right-color:var(--cy);animation:spin 6s linear infinite}
  .core{width:32%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,var(--hi) 0,var(--ice) 22%,var(--cy) 58%,transparent 72%);box-shadow:0 0 50px var(--cy);animation:breathe 4s ease-in-out infinite}
  body[data-state=listening] .core{animation-duration:2.4s}
  body[data-state=thinking] .r1{animation-duration:2s}
  body[data-state=thinking] .r3{animation-duration:1.2s}
  body[data-state=speaking] .core{animation:talk .5s ease-in-out infinite}
  body[data-state=acting] .r2{animation-duration:3s}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes breathe{50%{transform:scale(1.12);opacity:.85}}
  @keyframes talk{0%,100%{transform:scale(1)}50%{transform:scale(1.28)}}
  @media (prefers-reduced-motion:reduce){.ring,.core{animation:none!important}}


  /* ---------- Avatares holográficos (imágenes) ---------- */
  body:not([data-avatar=orbe]) .ring,body:not([data-avatar=orbe]) .core{display:none}
  body:not([data-avatar=orbe]) .orb{width:auto;border-radius:12px;--h:min(34vmin,290px)}
  body[data-avatar=mujer] .orb{height:var(--h);aspect-ratio:515/474;--h:min(38vmin,320px)}
  body[data-avatar=hombre] .orb{--h:min(42vmin,340px);height:var(--h);aspect-ratio:335/594}
  body:not([data-avatar=orbe]).playing .orb{--h:min(15vmin,120px)!important}
  .holo{display:none;position:absolute;inset:0;pointer-events:none}
  body:not([data-avatar=orbe]) .holo{display:block}
  .holo canvas{position:absolute;inset:-12% -22%;width:144%;height:124%}
  .hbeam{position:absolute;left:8%;right:8%;bottom:2%;height:92%;clip-path:polygon(18% 100%,82% 100%,100% 0,0 0);background:linear-gradient(to top,color-mix(in srgb,var(--cy) 26%,transparent),transparent 85%);opacity:.7}
  .hbase{position:absolute;left:-6%;right:-6%;bottom:-3%;height:9%}
  .hbase i{position:absolute;inset:0;border-radius:50%;border:1.5px solid var(--cy);box-shadow:0 0 14px var(--cy),inset 0 0 12px color-mix(in srgb,var(--cy) 50%,transparent)}
  .hbase i+i{inset:-22% -10%;border-style:dashed;border-width:1px;opacity:.55;animation:hpulse 3s ease-in-out infinite}
  .hfig{position:absolute;inset:0;filter:drop-shadow(0 0 9px var(--cy));animation:hfloat 6s ease-in-out infinite;transform-origin:50% 100%}
  body[data-avatar=hombre] .hfig{animation-name:hbreath;animation-duration:5s}
  .hfig img{display:block;width:100%;height:100%;object-fit:contain;animation:hflick 7s steps(1) infinite;-webkit-user-drag:none;user-select:none}
  .hfig i{position:absolute;inset:0;-webkit-mask:var(--img) center/contain no-repeat;mask:var(--img) center/contain no-repeat}
  .hscan{background:repeating-linear-gradient(to bottom,rgba(0,8,20,.22) 0 1px,transparent 1px 4px)}
  .hband{background:linear-gradient(to bottom,transparent,rgba(255,255,255,.4) 50%,transparent) 0 -30%/100% 24% no-repeat;mix-blend-mode:screen;animation:hsweep 4.2s linear infinite}
  body[data-state=thinking] .hband{animation-duration:1.2s}
  body[data-state=thinking] .hfig{filter:drop-shadow(0 0 14px var(--cy))}
  body[data-state=listening] .hfig{filter:drop-shadow(0 0 12px var(--cy))}
  body[data-state=speaking] .hfig{filter:drop-shadow(0 0 calc(8px + var(--lvl,.4) * 14px) var(--cy))}
  body[data-state=speaking] .hfig img{filter:brightness(calc(1 + var(--lvl,.3) * .16))}
  @keyframes hfloat{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-3.5%) rotate(.7deg)}}
  @keyframes hbreath{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(-.8%) scaleY(1.012)}}
  @keyframes hsweep{to{background-position:0 130%}}
  @keyframes hpulse{50%{opacity:.15;transform:scale(1.05)}}
  @keyframes hflick{0%,100%{opacity:1;transform:none}90%{opacity:.86}92%{opacity:.6;transform:translateX(1.5px)}94%{opacity:.95;transform:translateX(-1px)}96%{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.holo *{animation:none!important}}
  #log{width:100%;max-width:760px;flex:1;min-height:0;overflow-y:auto;padding:8px 20px;display:flex;flex-direction:column;gap:10px}
  .line{max-width:88%;padding:9px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);overflow-wrap:anywhere}
  .line.user{align-self:flex-end;color:var(--mute)}
  .line.jarvis{align-self:flex-start;border-color:color-mix(in srgb,var(--cy) 45%,var(--line))}
  .line.error{align-self:center;color:var(--err);border-color:var(--err);font-size:16px}
  .chip{align-self:flex-start;max-width:100%;font-size:15px;color:var(--amber);padding:2px 10px;border:1px solid color-mix(in srgb,var(--amber) 40%,transparent);border-radius:20px;overflow-wrap:anywhere}
  a.chip{text-decoration:underline}
  .chip.sim{color:var(--mute);border-color:var(--line)}
  #lvl{width:min(60vw,260px);height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin:-4px 0 8px;opacity:0;transition:opacity .2s;flex:none}
  #lvl.on{opacity:1}
  #lvl i{display:block;height:100%;width:0;background:var(--cy)}
  #player{width:min(92vw,440px);flex:none;margin:0 0 8px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#000}
  #player[hidden]{display:none}
  .phead{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:4px 10px;background:var(--panel);font-size:15px}
  #ptitle{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mute)}
  #yt{display:block;width:100%;aspect-ratio:16/9;border:0}
  body.playing .orb{width:min(16vmin,110px);margin:1vh 0}
  #interim{min-height:24px;color:var(--mute);font-style:italic;text-align:center;font-size:16px;padding:0 20px}

  form{width:100%;max-width:760px;display:flex;gap:10px;padding:6px 20px 8px}
  input[type=text]{flex:1;min-width:0;background:var(--panel);color:var(--ice);border:1px solid var(--line);border-radius:10px;padding:11px 14px;font:inherit}
  button.btn{background:var(--panel);color:var(--ice);border:1px solid var(--line);border-radius:10px;padding:0 18px;font:600 17px var(--font);cursor:pointer}
  button.btn:hover{border-color:var(--cy)}
  #mic[aria-pressed=true]{background:var(--cy);color:var(--ink);border-color:var(--cy)}
  .opts{width:100%;max-width:760px;display:flex;flex-wrap:wrap;gap:6px 18px;padding:0 20px 14px;color:var(--mute);font-size:15px;align-items:center}
  .opts label{display:flex;gap:6px;align-items:center}
  .mini{background:var(--panel);color:var(--ice);border:1px solid var(--line);border-radius:8px;padding:4px 8px;font:inherit;font-size:15px;flex:none}
  select{background:var(--panel);color:var(--ice);border:1px solid var(--line);border-radius:8px;padding:4px 6px;font:inherit;font-size:15px;max-width:220px}
</style>
</head>
<body data-state="idle">
<header><div style="display:flex;gap:12px;align-items:baseline"><h1 id="logo" style="user-select:none">RADEX</h1><span id="ver" title="Versión instalada (clic para buscar actualizaciones)"></span></div><span id="status" aria-live="polite">En espera</span></header>

<button class="orb" id="orb" aria-label="Interrumpir a Radex">
  <span class="ring r1"></span><span class="ring r2"></span><span class="ring r3"></span><span class="core"></span>
  <span class="holo" aria-hidden="true">
    <canvas id="holoFx"></canvas>
    <span class="hbeam"></span>
    <span class="hfig"><img id="holoImg" alt="" draggable="false"><i class="hscan"></i><i class="hband"></i></span>
    <span class="hbase"><i></i><i></i></span>
  </span>
</button>

<dialog id="diag" aria-label="Prueba del micrófono">
  <h2>PRUEBA DEL MICRÓFONO</h2>
  <div class="row"><span>Permiso</span><b id="dgPerm">…</b></div>
  <label class="row">Micrófono <select id="dgDev"></select></label>
  <label class="row">Sensibilidad <select id="dgGain"><option value="1">Normal</option><option value="2">Alta (voz baja)</option><option value="4">Muy alta</option></select></label>
  <div class="dgbar"><i id="dgLvl"></i></div>
  <p id="dgMsg">Pulsa «Iniciar prueba» y di algo.</p>
  <p id="dgOut"></p>
  <div class="row btns"><button type="button" class="mini" id="dgStart">Iniciar prueba</button><button type="button" class="mini" id="dgRec">Grabar 4 s y transcribir</button><button type="button" class="mini" id="dgWin">Privacidad de Windows</button><button type="button" class="mini" id="dgClose">Cerrar</button></div>
</dialog>
<div id="lvl" aria-hidden="true"><i></i></div>
<div id="player" hidden>
  <div class="phead"><span id="ptitle"></span><button type="button" class="btn" id="pclose" style="padding:2px 12px">Cerrar</button></div>
  <iframe id="yt" title="Reproductor de YouTube" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
</div>
<div id="log" aria-live="polite"></div>
<div id="interim"></div>

<form id="form" autocomplete="off">
  <button type="button" class="btn" id="mic" aria-pressed="false">Activar voz</button>
  <input type="text" id="text" placeholder="Escribe o activa la voz" aria-label="Mensaje">
  <button class="btn" type="submit">Enviar</button>
</form>
<div class="opts">
  <label><input type="checkbox" id="wake"> Solo si digo “Radex”</label>
  <label title="Dices “Radex” una vez para empezar y ya no hace falta repetirlo. Al terminar di “Radex, desactívate” y vuelve a dormir hasta que lo llames"><input type="checkbox" id="awake"> Modo conversación</label>
  <label title="Solo obedece lo que digas mientras mantienes pulsada la tecla Ctrl"><input type="checkbox" id="ptt"> Solo mientras mantengo Ctrl</label>
  <label><input type="checkbox" id="mute"> Sin voz</label>
  <button type="button" class="mini" id="diagBtn" title="Comprobar permiso, elegir micrófono y probar que te entiende">Probar micrófono</button>
  <label>Avatar <select id="avatar" aria-label="Avatar"><option value="orbe">Orbe</option><option value="mujer">Holograma mujer</option><option value="hombre">Holograma hombre</option></select></label>
  <label>Oído <select id="earsel" aria-label="Motor de oído"><option value="auto">Automático</option><option value="groq">Groq Whisper (rápido)</option><option value="gemini">Gemini</option></select></label>
  <div id="apiCfg" style="display:none;gap:6px 18px;flex-wrap:wrap;align-items:center">
  <label>Cerebro
    <select id="prov" aria-label="Proveedor del cerebro">
      <option value="groq">Groq (gratis, recomendado)</option>
      <option value="openrouter">OpenRouter (gratis)</option>
      <option value="gemini">Gemini (gratis)</option>
      <option value="custom">Otro (compatible OpenAI)</option>
    </select>
  </label>
  <label>Clave <input type="password" id="key" placeholder="pega tu clave" autocomplete="off" aria-label="Clave de API" class="mini" style="width:150px"></label>
  <label>Modelo <input type="text" id="model" aria-label="Modelo" class="mini" style="width:150px"></label>
  <label id="urlRow" hidden>URL <input type="text" id="url" placeholder="http://localhost:11434/v1" aria-label="URL base" class="mini" style="width:200px"></label>
  <label id="kgroqRow" hidden>Clave Groq (oído) <input type="password" id="kgroq" placeholder="gsk_…" autocomplete="off" aria-label="Clave de Groq" class="mini" style="width:150px"></label>
  <label id="kgemRow" hidden>Clave Gemini (voz) <input type="password" id="kgem" placeholder="AIza…" autocomplete="off" aria-label="Clave de Gemini" class="mini" style="width:150px"></label>
  <span id="keyHelp" style="flex-basis:100%;font-size:14px"></span>
  </div>
  <label>Motor de voz <select id="tts" aria-label="Motor de voz"><option value="gemini">Gemini (natural)</option><option value="browser">Navegador</option></select></label>
  <label>Voz Gemini <select id="gvoice" aria-label="Voz de Gemini"><option>Kore</option><option>Aoede</option><option>Zephyr</option><option>Puck</option><option>Charon</option><option>Fenrir</option><option>Orus</option></select></label>
  <label>Voz del navegador <select id="voice" aria-label="Voz del navegador"></select></label>
  <label>Reproducir en <select id="ydest" aria-label="Dónde reproducir los videos"><option value="pagina">Esta página</option><option value="ventana">Pestaña nueva de YouTube</option></select></label>
  <label>Velocidad <input type="range" id="rate" min="0.8" max="1.3" step="0.05" value="1.05"></label>
</div>

<script>
/* =====================================================================
   Radex — versión web de pruebas
   Capas (pensadas para pasar a .exe sin reescribir):
   1) Oído/voz:   Web Speech (o dictation si corre dentro de Claude) + speechSynthesis
   2) Cerebro:    API compatible con OpenAI (Gemini gratis, Ollama, etc.); clave solo en tu navegador
   3) Acciones:   TOOLS_WEB (funcionan en el navegador) y TOOLS_NATIVE
                  (acciones de PC). En el .exe, window.jarvisNative las
                  implementa; en la web devuelven un aviso de "simulada".
   ===================================================================== */
const $ = (s) => document.querySelector(s);
const store = {
  get: (k, d) => { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
};
let history = [], listening = false, busy = false, speaking = false, sampler = null;

function setState(s, label) { document.body.dataset.state = s; $('#status').textContent = label; }
function addEl(cls, text, href) {
  const d = document.createElement(href ? 'a' : 'div');
  d.className = cls; d.textContent = text;
  if (href) { d.href = href; d.target = '_blank'; d.rel = 'noopener noreferrer'; }
  $('#log').appendChild(d); $('#log').scrollTop = 1e9;
}
const addLine = (role, text) => addEl('line ' + role, text);
const whenFree = (fn) => (busy || speaking) ? setTimeout(() => whenFree(fn), 1500) : fn();

/* ---------- Voz de salida ---------- */
let voices = [];
function loadVoices() {
  if (!window.speechSynthesis) return;
  voices = speechSynthesis.getVoices().filter((v) => v.lang.toLowerCase().startsWith('es'));
  voices.sort((a, b) => /natural|online/i.test(b.name) - /natural|online/i.test(a.name));
  const sel = $('#voice'), saved = store.get('voice', '');
  sel.innerHTML = '';
  voices.forEach((v) => sel.add(new Option(v.name, v.name)));
  if (voices.some((v) => v.name === saved)) sel.value = saved;
  else if (voices.length) store.set('voice', sel.value); // se fija y ya no cambia sola
}
loadVoices();
if (window.speechSynthesis) speechSynthesis.onvoiceschanged = loadVoices;
$('#voice').onchange = (e) => store.set('voice', e.target.value);

/* ---------- Versión instalada y actualizaciones (solo escritorio) ---------- */
if (window.elixApp) {
  let ver = '', upd = { estado: 'inicio' };
  const paint = () => {
    const t = { buscando: ' · buscando actualización…', descargando: ` · descargando${upd.version ? ' ' + upd.version : ''}${upd.pct ? ' ' + upd.pct + '%' : ''}…`,
      listo: ` · ${upd.version || 'nueva versión'} lista: clic para reiniciar`, 'al-dia': ' · al día ✓', error: ' · no pude buscar actualizaciones (clic para ver el motivo)', dev: ' · modo desarrollo' }[upd.estado] || '';
    $('#ver').textContent = ver ? 'v' + ver + t : '';
    $('#ver').title = upd.estado === 'error' && upd.detalle ? upd.detalle : 'Versión instalada (clic para buscar actualizaciones)';
  };
  elixApp.info().then((i) => { if (!i) return; ver = i.version; upd = i.status || upd; paint(); });
  elixApp.onUpdate((s) => { upd = s; paint(); });
  $('#ver').onclick = () => {
    if (upd.estado === 'listo') return elixApp.installNow();
    if (upd.estado === 'error' && upd.detalle) addLine('error', 'Actualización: ' + upd.detalle);
    elixApp.checkUpdate();
  };
}
$('#wake').checked = store.get('wake2', '1') === '1'; // activada por defecto
$('#wake').onchange = (e) => store.set('wake2', e.target.checked ? '1' : '0');

function speakBrowser(text) {
  return new Promise((resolve) => {
    if (!text || $('#mute').checked || !window.speechSynthesis) return resolve();
    speechSynthesis.cancel();
    const parts = (text.match(/[^.!?…]+[.!?…]*\s*/g) || [text]).map((p) => p.trim()).filter(Boolean);
    speaking = true; setState('speaking', 'Hablando');
    let i = 0;
    const next = () => {
      if (i >= parts.length || !speaking) { speaking = false; return resolve(); }
      const u = new SpeechSynthesisUtterance(parts[i++]);
      const v = voices.find((x) => x.name === $('#voice').value) || voices[0];
      if (v) { u.voice = v; u.lang = v.lang; } else u.lang = 'es-ES';
      u.rate = +$('#rate').value;
      u.onend = next; u.onerror = next;
      speechSynthesis.speak(u);
    };
    next();
  });
}
const TTS_MODEL = 'gemini-2.5-flash-preview-tts';
let ttsCool = 0, ttsSrc = null, ttsCtx = null;
$('#tts').value = store.get('jarvis:tts', 'browser');
$('#tts').onchange = (e) => store.set('jarvis:tts', e.target.value);
$('#gvoice').value = store.get('jarvis:gvoice', 'Kore');
$('#gvoice').onchange = (e) => store.set('jarvis:gvoice', e.target.value);
$('#ydest').value = store.get('jarvis:ydest', 'pagina');
$('#ydest').onchange = (e) => store.set('jarvis:ydest', e.target.value);

function stopSpeaking() {
  speaking = false;
  try { speechSynthesis.cancel(); } catch {}
  try { ttsSrc && ttsSrc.stop(); } catch {}
}
$('#orb').onclick = () => { if (speaking) stopSpeaking(); };

async function speakGemini(text) {
  const gk = keyOf('gemini');
  if (!gk) return false;
  speaking = true; setState('thinking', 'Preparando voz');
  try {
    const r = await apiFetch('https://generativelanguage.googleapis.com/v1beta/models/' + TTS_MODEL + ':generateContent', {
      timeout: 12000,
      headers: { 'content-type': 'application/json', 'x-goog-api-key': gk },
      body: JSON.stringify({
        contents: [{ parts: [{ text: 'Di de forma natural, cálida y tranquila, en español latinoamericano: ' + text }] }],
        generationConfig: { responseModalities: ['AUDIO'], speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: $('#gvoice').value } } } },
      }),
    });
    if (!r.ok) { ttsCool = Date.now() + ((r.status === 429 || r.status >= 500) ? 60000 : 600000); return false; }
    const d = r.data;
    const part = (d.candidates?.[0]?.content?.parts || []).find((x) => x.inlineData);
    if (!part) { ttsCool = Date.now() + 60000; return false; }
    if (!speaking) return true; // lo interrumpieron mientras se generaba
    const rate = +((part.inlineData.mimeType || '').match(/rate=(\d+)/)?.[1] || 24000);
    const bin = atob(part.inlineData.data), n = bin.length >> 1, f = new Float32Array(n);

let lvlAn = null, lvlBuf = null, lvlRaf = 0;
function voiceLevelOn(ctx, src) {
  try {
    lvlAn = lvlAn || Object.assign(ctx.createAnalyser(), { fftSize: 512, smoothingTimeConstant: 0.6 });
    lvlBuf = lvlBuf || new Uint8Array(lvlAn.fftSize);
    src.connect(lvlAn);
    cancelAnimationFrame(lvlRaf);
    const tick = () => {
      lvlAn.getByteTimeDomainData(lvlBuf);
      let sum = 0; for (const v of lvlBuf) { const x = (v - 128) / 128; sum += x * x; }
      document.body.style.setProperty('--lvl', Math.min(1, Math.sqrt(sum / lvlBuf.length) * 5).toFixed(2));
      lvlRaf = requestAnimationFrame(tick);
    };
    tick();
    src.addEventListener('ended', () => { cancelAnimationFrame(lvlRaf); document.body.style.removeProperty('--lvl'); });
  } catch {}
}

// Partículas (puntos y ceros/unos) que suben alrededor del holograma; más rápidas al hablar o pensar
const FX = { ps: [], raf: 0, w: 0, h: 0 };
function fxKick() {
  cancelAnimationFrame(FX.raf);
  const cv = $('#holoFx'), on = document.body.dataset.avatar !== 'orbe' && !matchMedia('(prefers-reduced-motion:reduce)').matches;
  if (!on) return;
  const ctx = cv.getContext('2d'), dpr = Math.min(devicePixelRatio || 1, 2);
  const size = () => { const r = cv.getBoundingClientRect(); FX.w = r.width; FX.h = r.height; cv.width = r.width * dpr; cv.height = r.height * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); };
  size();
  const mk = (init) => ({ x: Math.random() * FX.w, y: init ? Math.random() * FX.h : FX.h * (0.75 + Math.random() * 0.25),
    v: 0.25 + Math.random() * 0.7, r: 0.8 + Math.random() * 1.8, a: 0.25 + Math.random() * 0.6, d: Math.random() < 0.3 ? (Math.random() < 0.5 ? '0' : '1') : '', ph: Math.random() * 6.28 });
  FX.ps = Array.from({ length: 46 }, () => mk(true));
  let t = 0;
  const frame = () => {
    const st = document.body.dataset.state, k = st === 'speaking' ? 2.2 : st === 'thinking' ? 3.2 : st === 'listening' ? 1.4 : 1;
    ctx.clearRect(0, 0, FX.w, FX.h); t += 0.02;
    const col = getComputedStyle(document.body).getPropertyValue('--cy').trim() || '#4fd8ff';
    ctx.fillStyle = col; ctx.shadowColor = col; ctx.shadowBlur = 6; ctx.font = '11px monospace';
    FX.ps.forEach((p, i) => {
      p.y -= p.v * k; p.x += Math.sin(t + p.ph) * 0.25;
      if (p.y < -8) FX.ps[i] = mk(false);
      ctx.globalAlpha = p.a * Math.min(1, p.y / (FX.h * 0.25)) ;
      if (p.d) ctx.fillText(p.d, p.x, p.y); else { ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill(); }
    });
    ctx.globalAlpha = 1;
    FX.raf = document.hidden ? 0 : requestAnimationFrame(frame);
  };
  frame();
}

const YN_FILL = new Set(['por', 'favor', 'radex', 'gracias', 'de', 'que', 'ya', 'pues', 'eh']);
const YN_YES = new Set(['si', 'claro', 'confirmo', 'confirmado', 'dale', 'adelante', 'hazlo', 'ok', 'okay', 'vale', 'correcto', 'afirmativo', 'procede', 'yes', 'exacto', 'acuerdo']);

function classifyYesNo(t) {
  const w = String(t || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9 ]/g, ' ').split(/\s+/).filter(Boolean);

  const yes = w.some((x) => YN_YES.has(x)), no = w.some((x) => YN_NO.has(x) && x !== 'mejor');
  if (yes && no) return null;
  if (yes && w.every((x) => YN_YES.has(x) || YN_FILL.has(x))) return 'yes';
  if (no && w.every((x) => YN_NO.has(x) || YN_FILL.has(x))) return 'no';
  return null;
}
// Si hay una acción esperando confirmación: consume lo pendiente y dice si el usuario respondió sí o no (o null si dijo otra cosa)
function takePendingConfirm(text) {
  if (!pendingConfirm) return null;
  const p = pendingConfirm; pendingConfirm = null;
  const now = Date.now();
  const k = now > p.exp + CONFIRM_GRACE_MS ? null : classifyYesNo(text);
  if (now > p.exp) { // venció: NUNCA se ejecuta; se cancela en el sistema y, si dijo sí, se le avisa

    if (k === 'yes') { lastExpired = p.resumen || ''; return 'expired'; }
    return k; // 'no' tardío: se cancela con normalidad; otra cosa: sigue la conversación normal
  }
  if (!k) { try { window.elixTools.confirm(false); } catch {} } // dijo otra cosa: se cancela
  return k;
}

const NET_HOSTS = /^https:\/\/(api\.groq\.com|openrouter\.ai|generativelanguage\.googleapis\.com|www\.googleapis\.com)\//;
async function apiFetch(url, { headers = {}, body, form, timeout = 25000, method = 'POST' } = {}) {
  if (window.elixNet && NET_HOSTS.test(url)) {
    const r = await window.elixNet.fetch({ url, method, headers, body, form, timeout });
    if (!r || r.status === 0) { const e = new Error((r && r.body) || 'sin conexión'); e.name = r && r.aborted ? 'AbortError' : 'NetError'; throw e; }
    let data = {}; try { data = JSON.parse(r.body); } catch {}
    return { ok: r.status >= 200 && r.status < 300, status: r.status, data };
  }
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), timeout);
  try {
    const init = { method, headers: { ...headers }, signal: ctl.signal };
    if (form) {
      const fd = new FormData();
      Object.entries(form.fields).forEach(([k, v]) => fd.append(k, v));
      fd.append('file', new Blob([form.file.bytes], { type: form.file.type }), form.file.name);
      init.body = fd;
    } else init.body = body;
    const r = await fetch(url, init);
    let data = {}; try { data = await r.json(); } catch {}
    return { ok: r.ok, status: r.status, data };
  } finally { clearTimeout(timer); }
}

async function askLLM(msgs, tools) {

        if (c.prov === 'groq' && /gpt-oss/.test(mdl)) payload.reasoning_effort = 'low'; // responde rápido, sin pensar de más

        } catch (e) {
          if (e.name === 'AbortError') { last = { status: 0, detail: 'timeout' }; break; }

        }

            $('#model').value = mdl; store.set('jarvis:model2:' + c.prov, mdl);

      throw { message: `El modelo tardó más de ${timeoutMs / 1000} segundos en responder. Prueba otra vez o cambia el modelo en el campo “Modelo”.` };
    if (last.status === 503 || last.status === 429)
      throw { message: `${P.name} está saturado o llegaste al límite gratuito. Prueba de nuevo en un minuto, o cambia de proveedor en el panel de API (doble clic en RADEX).` };
    throw { message: `Error ${last.status} del proveedor. ${last.detail}`.trim() };
  }
  // La fecha va en el último mensaje del usuario (no en el sistema) para que el inicio de la petición no cambie y el proveedor pueda reutilizarlo
  const stamp = new Date().toLocaleString('es', { dateStyle: 'full', timeStyle: 'short' });
  const base = msgs.map((m) => ({ role: m.role, content: m.content }));
  for (let i = base.length - 1; i >= 0; i--) if (base[i].role === 'user') { base[i].content = `[${stamp}] ${base[i].content}`; break; }
  const messages = [{ role: 'system', content: instrucciones() }, ...base];
  for (let i = 0; i < 6; i++) {
    const d = await post(messages);
    const m = d.choices?.[0]?.message;
    if (!m) throw { message: 'El proveedor no devolvió respuesta.' };
    const { reasoning, reasoning_content, ...am } = m; // el razonamiento interno no se reenvía
    messages.push(am);
    if (!m.tool_calls || !m.tool_calls.length) return { text: (m.content || '').replace(/<think>[\s\S]*?<\/think>/gi, '').trim() };
    for (const call of m.tool_calls) {
      const t = tools.find((x) => x.name === call.function.name);
      let input = {};
      try { input = JSON.parse(call.function.arguments || '{}'); } catch {}
      let out;
      try { out = t ? await t.execute(input) : 'Herramienta desconocida'; } catch (e) { out = 'Error: ' + (e.message || e); }
      messages.push({ role: 'tool', tool_call_id: call.id, name: call.function.name, content: typeof out === 'string' ? out : JSON.stringify(out) });
    }
  }
  return { text: 'Me enredé con tantos pasos. ¿Lo intentamos de nuevo?' };
}

async function send(text) {
  if (!text || busy) return;
  busy = true; ear.stop();
  if (speaking) stopSpeaking();
  addLine('user', text); setState('thinking', 'Pensando');
  history = trim([...history, { role: 'user', content: text }]);
  const turnStart = history.length;
  try {
    const yn = takePendingConfirm(text); // ¿está respondiendo a una confirmación pendiente?
    if (yn) {
      const reply = yn === 'expired'
        ? (addEl('chip', 'confirmación vencida: no se hizo nada' + (lastExpired ? ' (' + lastExpired.slice(0, 200) + ')' : '')),
           'Esa confirmación ya venció, así que no hice nada' + (lastExpired ? ' (' + lastExpired.replace(/[.\s]+$/, '') + ')' : '') + '. Si todavía lo quieres, pídemelo otra vez.')
        : await resolveConfirm(yn === 'yes');
      history = trim([...history, { role: 'assistant', content: reply }]);
      addLine('jarvis', reply);
      await speak(reply);
      return;
    }
    const c = cfg();
    if (c.prov !== 'custom' && !c.key) throw { message: `Falta la clave gratuita de ${PRESETS[c.prov].name}. ${PRESETS[c.prov].help} Pégala en el campo “Clave” (doble clic en RADEX para mostrar la configuración de API).` };
    if (!c.base) throw { message: 'Escribe la URL del proveedor en el campo “URL”.' };
    const msgs = history;
    const tools = [...ALL_TOOLS, ...REG_TOOLS].map((t) => ({
      name: t.name, description: t.description, inputSchema: t.inputSchema,
      execute: async (input) => {
        setState('acting', 'Ejecutando');
        let out;
        try { out = await t.execute(input || {}); } catch (e) { out = 'Error: ' + (e.message || e); }
        const sim = t.native && !window.jarvisNative;
        addEl('chip' + (sim ? ' sim' : ''), `${t.name}${Object.keys(input || {}).length ? ' ' + JSON.stringify(input) : ''}: ${String(out).slice(0, 900)}`);
        return out;
      },
    }));
    const res = await askLLM(msgs, tools);
    const reply = (res.text || '').trim() || 'Listo.';
    history = trim([...history, { role: 'assistant', content: reply }]);
    addLine('jarvis', reply);
    await speak(reply);
    // Si la respuesta era la pregunta de una confirmación: tiene 5 s desde que termina de hablar (nunca más de 10 s desde la orden)
    if (pendingConfirm && pendingConfirm.hard) pendingConfirm.exp = Math.min(pendingConfirm.hard, Date.now() + CONFIRM_ANSWER_MS);
  } catch (e) {
    history = history.slice(0, Math.max(0, turnStart - 1));
    const msg = e?.code === 'not_granted' ? 'Necesito tu permiso para usar a Claude como cerebro. Vuelve a intentarlo y acepta.'
      : e?.code === 'rate_limited' ? 'Demasiadas peticiones seguidas. Espera unos segundos.'
      : (e?.message || 'Error desconocido');
    addLine('error', msg);
    await speak('Algo falló. Mira el mensaje en pantalla.');
  } finally {
    busy = false; afterTurn();
  }
}

$('#form').onsubmit = (e) => {
  e.preventDefault();
  const t = $('#text').value.trim();
  $('#text').value = '';
  send(t);
};
ear.init();
</script>
