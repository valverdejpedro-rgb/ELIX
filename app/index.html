<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Radex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#050b14; --panel:#0b1626; --line:#17304a; --ice:#d9f4ff; --mute:#7a95ad;
    --cy:#4fd8ff; --amber:#ffb347; --err:#ff8a8a; --hi:#fff;
    --font:'Rajdhani','Segoe UI',system-ui,sans-serif;
    color-scheme:dark; box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  body[data-state=acting]{--cy:var(--amber)}
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{height:100%;margin:0}
  body{background:radial-gradient(ellipse at 50% 26%,#0c2036 0,var(--ink) 62%);color:var(--ice);font:500 18px/1.4 var(--font);display:flex;flex-direction:column;align-items:center;overflow:hidden}
  header{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:baseline;padding:16px 20px 0}
  h1{margin:0;font-weight:600;font-size:22px;letter-spacing:.32em;color:var(--cy)}
  #status{color:var(--mute);font-size:16px}
  #ver{color:var(--mute);font-size:14px;cursor:pointer;letter-spacing:.04em}
  #ver:hover{color:var(--cy)}

  .mini{background:none;border:1px solid var(--line);color:var(--ice);border-radius:8px;padding:3px 12px;font:inherit;font-size:15px;cursor:pointer}
  .mini:hover{border-color:var(--cy);color:var(--cy)}
  dialog#diag{background:var(--panel);color:var(--ice);border:1px solid var(--cy);border-radius:14px;padding:18px 20px;width:min(92vw,470px);font:500 16px/1.4 var(--font)}
  dialog#diag::backdrop{background:rgba(2,6,12,.72)}
  #diag h2{margin:0 0 8px;font-size:19px;color:var(--cy);letter-spacing:.06em}
  #diag .row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:8px 0}
  #diag select{background:var(--ink);color:var(--ice);border:1px solid var(--line);border-radius:8px;padding:4px 6px;font:inherit;max-width:270px}
  #diag .btns{flex-wrap:wrap;justify-content:flex-start;margin-top:12px}
  .dgbar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:12px 0 6px}
  .dgbar i{display:block;height:100%;width:0;background:var(--cy);transition:width .06s}
  #dgMsg{margin:6px 0}#dgOut{margin:6px 0;color:var(--amber);min-height:1.4em}
  #silBar{width:100%;max-width:760px;padding:10px 20px 0;display:flex;flex-direction:column;gap:6px}
  .sil{display:flex;justify-content:space-between;align-items:center;gap:12px;border-radius:12px;padding:10px 16px;font-weight:600;letter-spacing:.04em}
  .sil.in{background:#3a0f14;border:2px solid #ff4d5e;color:#ffd6da;font-size:22px;animation:silPulse 1.6s ease-in-out infinite}
  .sil.out{background:#33250a;border:1px solid var(--amber);color:#ffe2b0;font-size:17px}
  .sil .t{font:700 28px/1 var(--font);font-variant-numeric:tabular-nums;color:#fff;white-space:nowrap}
  .sil.out .t{font-size:20px}
  .sil small{display:block;font-weight:500;font-size:14px;opacity:.85;letter-spacing:0}
  @keyframes silPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,77,94,.55)}50%{box-shadow:0 0 18px 4px rgba(255,77,94,.55)}}
  .orb{width:min(36vmin,280px);aspect-ratio:1;position:relative;margin:2vh 0;display:grid;place-items:center;cursor:pointer;border-radius:50%;flex:none;border:0;background:none;padding:0}
  .orb:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--cy);outline-offset:3px}
  .ring{position:absolute;border-radius:50%}
  .r1{inset:0;border:2px solid transparent;border-top-color:var(--cy);border-bottom-color:var(--cy);animation:spin 10s linear infinite}
  .r2{inset:11%;border:2px dashed color-mix(in srgb,var(--cy) 55%,transparent);animation:spin 22s linear infinite reverse}
  .r3{inset:23%;border:4px solid transparent;border-left-color:var(--cy);border-right-color:var(--cy);animation:spin 6s linear infinite}
  .core{width:32%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,var(--hi) 0,var(--ice) 22%,var(--cy) 58%,transparent 72%);box-shadow:0 0 50px var(--cy);animation:breathe 4s ease-in-out infinite}
  body[data-state=listening] .core{animation-duration:2.4s}
  body[data-state=thinking] .r1{animation-duration:2s}
  body[data-state=thinking] .r3{animation-duration:1.2s}
  body[data-state=speaking] .core{animation:talk .5s ease-in-out infinite}
  body[data-state=acting] .r2{animation-duration:3s}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes breathe{50%{transform:scale(1.12);opacity:.85}}
  @keyframes talk{0%,100%{transform:scale(1)}50%{transform:scale(1.28)}}
  @media (prefers-reduced-motion:reduce){.ring,.core{animation:none!important}}


  /* ---------- Avatares holográficos (imágenes) ---------- */
  body:not([data-avatar=orbe]) .ring,body:not([data-avatar=orbe]) .core{display:none}
  body:not([data-avatar=orbe]) .orb{width:auto;border-radius:12px;--h:min(34vmin,290px)}
  body[data-avatar=mujer] .orb{height:var(--h);aspect-ratio:515/474;--h:min(38vmin,320px)}
  body[data-avatar=hombre] .orb{--h:min(42vmin,340px);height:var(--h);aspect-ratio:335/594}
  body:not([data-avatar=orbe]).playing .orb{--h:min(15vmin,120px)!important}
  .holo{display:none;position:absolute;inset:0;pointer-events:none}
  body:not([data-avatar=orbe]) .holo{display:block}
  .holo canvas{position:absolute;inset:-12% -22%;width:144%;height:124%}
  .hbeam{position:absolute;left:8%;right:8%;bottom:2%;height:92%;clip-path:polygon(18% 100%,82% 100%,100% 0,0 0);background:linear-gradient(to top,color-mix(in srgb,var(--cy) 26%,transparent),transparent 85%);opacity:.7}
  .hbase{position:absolute;left:-6%;right:-6%;bottom:-3%;height:9%}
  .hbase i{position:absolute;inset:0;border-radius:50%;border:1.5px solid var(--cy);box-shadow:0 0 14px var(--cy),inset 0 0 12px color-mix(in srgb,var(--cy) 50%,transparent)}
  .hbase i+i{inset:-22% -10%;border-style:dashed;border-width:1px;opacity:.55;animation:hpulse 3s ease-in-out infinite}
  .hfig{position:absolute;inset:0;filter:drop-shadow(0 0 9px var(--cy));animation:hfloat 6s ease-in-out infinite;transform-origin:50% 100%}
  body[data-avatar=hombre] .hfig{animation-name:hbreath;animation-duration:5s}
  .hfig img{display:block;width:100%;height:100%;object-fit:contain;animation:hflick 7s steps(1) infinite;-webkit-user-drag:none;user-select:none}
  .hfig i{position:absolute;inset:0;-webkit-mask:var(--img) center/contain no-repeat;mask:var(--img) center/contain no-repeat}
  .hscan{background:repeating-linear-gradient(to bottom,rgba(0,8,20,.22) 0 1px,transparent 1px 4px)}
  .hband{background:linear-gradient(to bottom,transparent,rgba(255,255,255,.4) 50%,transparent) 0 -30%/100% 24% no-repeat;mix-blend-mode:screen;animation:hsweep 4.2s linear infinite}
  body[data-state=thinking] .hband{animation-duration:1.2s}
  body[data-state=thinking] .hfig{filter:drop-shadow(0 0 14px var(--cy))}
  body[data-state=listening] .hfig{filter:drop-shadow(0 0 12px var(--cy))}
  body[data-state=speaking] .hfig{filter:drop-shadow(0 0 calc(8px + var(--lvl,.4) * 14px) var(--cy))}
  body[data-state=speaking] .hfig img{filter:brightness(calc(1 + var(--lvl,.3) * .16))}
  @keyframes hfloat{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-3.5%) rotate(.7deg)}}
  @keyframes hbreath{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(-.8%) scaleY(1.012)}}
  @keyframes hsweep{to{background-position:0 130%}}
  @keyframes hpulse{50%{opacity:.15;transform:scale(1.05)}}
  @keyframes hflick{0%,100%{opacity:1;transform:none}90%{opacity:.86}92%{opacity:.6;transform:translateX(1.5px)}94%{opacity:.95;transform:translateX(-1px)}96%{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.holo *{animation:none!important}}
  #log{width:100%;max-width:760px;flex:1;min-height:0;overflow-y:auto;padding:8px 20px;display:flex;flex-direction:column;gap:10px}
  .line{max-width:88%;padding:9px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);overflow-wrap:anywhere}
  .line.user{align-self:flex-end;color:var(--mute)}
  .line.jarvis{align-self:flex-start;border-color:color-mix(in srgb,var(--cy) 45%,var(--line))}
  .line.error{align-self:center;color:var(--err);border-color:var(--err);font-size:16px}
  .chip{align-self:flex-start;max-width:100%;font-size:15px;color:var(--amber);padding:2px 10px;border:1px solid color-mix(in srgb,var(--amber) 40%,transparent);border-radius:20px;overflow-wrap:anywhere}
  a.chip{text-decoration:underline}
  .chip.sim{color:var(--mute);border-color:var(--line)}
  #lvl{width:min(60vw,260px);height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin:-4px 0 8px;opacity:0;transition:opacity .2s;flex:none}
  #lvl.on{opacity:1}
  #micNow{color:var(--mute);font-size:14px;margin:-2px 0 6px;text-align:center;max-width:92vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #lvl i{display:block;height:100%;width:0;background:var(--cy)}
  #player{width:min(92vw,440px);flex:none;margin:0 0 8px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#000}
  #player[hidden]{display:none}
  .phead{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:4px 10px;background:var(--panel);font-size:15px}
  #ptitle{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mute)}
  #yt{display:block;width:100%;aspect-ratio:16/9;border:0}
  body.playing .orb{width:min(16vmin,110px);margin:1vh 0}
  #interim{min-height:24px;color:var(--mute);font-style:italic;text-align:center;font-size:16px;padding:0 20px}

  form{width:100%;max-width:760px;display:flex;gap:10px;padding:6px 20px 8px}
  input[type=text]{flex:1;min-width:0;background:var(--panel);color:var(--ice);border:1px solid var(--line);border-radius:10px;padding:11px 14px;font:inherit}
  button.btn{background:var(--panel);color:var(--ice);border:1px solid var(--line);border-radius:10px;padding:0 18px;font:600 17px var(--font);cursor:pointer}
  button.btn:hover{border-color:var(--cy)}
  #mic[aria-pressed=true]{background:var(--cy);color:var(--ink);border-color:var(--cy)}
  .opts{width:100%;max-width:760px;display:flex;flex-wrap:wrap;gap:6px 18px;padding:0 20px 14px;color:var(--mute);font-size:15px;align-items:center}
  .opts label{display:flex;gap:6px;align-items:center}
  .mini{background:var(--panel);color:var(--ice);border:1px solid var(--line);border-radius:8px;padding:4px 8px;font:inherit;font-size:15px;flex:none}
  select{background:var(--panel);color:var(--ice);border:1px solid var(--line);border-radius:8px;padding:4px 6px;font:inherit;font-size:15px;max-width:220px}
  dialog#ord{background:var(--panel);color:var(--ice);border:1px solid var(--cy);border-radius:14px;padding:16px 18px;width:min(94vw,720px);max-height:88vh;font:500 16px/1.4 var(--font)}
  dialog#ord::backdrop{background:rgba(2,6,12,.72)}
  #ord h2{margin:0 0 8px;font-size:19px;color:var(--cy);letter-spacing:.06em}
  #ord h3{margin:14px 0 2px;font-size:16px;color:var(--cy)}
  #ord .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
  #ord .tab.on{background:var(--cy);color:var(--ink);border-color:var(--cy)}
  #ord .scroll{max-height:56vh;overflow-y:auto;padding-right:6px}
  #ord .m{color:var(--mute);font-size:14px;margin:2px 0 6px}
  #ord .it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
  #ord .it small{color:var(--mute)}
  #ord .bd{font-size:12px;padding:1px 8px;border-radius:10px;border:1px solid var(--line);font-weight:600}
  #ord .bd.ok{color:#8dffb0;border-color:#8dffb0}#ord .bd.no{color:var(--amber);border-color:var(--amber)}
  #ord .fila{display:flex;flex-direction:column;gap:4px;margin:10px 0}
  #ord input[type=text],#ord input[type=number]{background:var(--ink);color:var(--ice);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit;width:100%}
  #ord select{max-width:100%}
  #ord .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
</style>
</head>
<body data-state="idle">
<header><div style="display:flex;gap:12px;align-items:baseline"><h1 id="logo" style="user-select:none">RADEX</h1><span id="ver" title="Versión instalada (clic para buscar actualizaciones)"></span></div><span id="status" aria-live="polite">En espera</span></header>

<div id="silBar" role="status" aria-live="polite" hidden></div>

<button class="orb" id="orb" aria-label="Interrumpir a Radex">
  <span class="ring r1"></span><span class="ring r2"></span><span class="ring r3"></span><span class="core"></span>
  <span class="holo" aria-hidden="true">
    <canvas id="holoFx"></canvas>
    <span class="hbeam"></span>
    <span class="hfig"><img id="holoImg" alt="" draggable="false"><i class="hscan"></i><i class="hband"></i></span>
    <span class="hbase"><i></i><i></i></span>
  </span>
</button>

<dialog id="diag" aria-label="Prueba del micrófono">
  <h2>PRUEBA DEL MICRÓFONO</h2>
  <div class="row"><span>Permiso</span><b id="dgPerm">…</b></div>
  <label class="row">Micrófono <select id="dgDev"></select></label>
  <label class="row" title="Ignora lo que suene mucho más flojo que tu voz (la tele, gente al fondo). Con «No filtrar» ELIX funciona como siempre.">Voces lejanas <select id="dgFar"><option value="1">No filtrar</option><option value="2">Filtrar (tele)</option><option value="3.5">Filtrar fuerte</option></select></label>
  <label class="row">Sensibilidad <select id="dgGain"><option value="1">Normal</option><option value="2">Alta (voz baja)</option><option value="4">Muy alta</option></select></label>
  <div class="dgbar"><i id="dgLvl"></i></div>
  <p id="dgMsg">Pulsa «Iniciar prueba» y di algo.</p>
  <p id="dgOut"></p>
  <div class="row btns"><button type="button" class="mini" id="dgStart">Iniciar prueba</button><button type="button" class="mini" id="dgRec">Grabar 4 s y transcribir</button><button type="button" class="mini" id="dgWin">Privacidad de Windows</button><button type="button" class="mini" id="dgClose">Cerrar</button></div>
</dialog>
<dialog id="ord" aria-label="Órdenes">
  <h2>ÓRDENES</h2>
  <div class="tabs">
    <button type="button" class="mini tab" data-t="conocidas">Conocidas</button>
    <button type="button" class="mini tab" data-t="anadir">Añadir</button>
    <button type="button" class="mini tab" data-t="oido">Lo que oyó</button>
    <button type="button" class="mini tab" data-t="memoria">Memoria</button>
  </div>
  <div class="scroll">
    <div class="pane" data-t="conocidas" id="ordP1"></div>
    <div class="pane" data-t="anadir" id="ordP3" hidden>
      <p class="m">Enséñale una frase nueva (por ejemplo, cómo te sale cuando hablas lejos del micrófono) y elige qué debe hacer. Se ejecuta al instante, sin gastar tokens y sin decir «Radex».</p>
      <div class="fila"><label for="ordFrase">Cuando yo diga</label><input type="text" id="ordFrase" placeholder="ej.: pon los parlantes" autocomplete="off"></div>
      <div class="fila"><label for="ordAccion">Quiero que haga</label><select id="ordAccion"></select><input type="text" id="ordParam" hidden autocomplete="off"></div>
      <div class="btns"><button type="button" class="mini" id="ordGuardar">Guardar orden</button></div>
      <p class="m" id="ordMsg"></p>
    </div>
    <div class="pane" data-t="oido" id="ordP2" hidden></div>
    <div class="pane" data-t="memoria" id="ordP4" hidden></div>
  </div>
  <div class="btns"><button type="button" class="mini" id="ordExport">Guardar lista (.txt)</button><button type="button" class="mini" id="ordClose">Cerrar</button></div>
</dialog>
<div id="lvl" aria-hidden="true"><i></i></div>
<div id="micNow" hidden></div>
<div id="player" hidden>
  <div class="phead"><span id="ptitle"></span><button type="button" class="btn" id="pclose" style="padding:2px 12px">Cerrar</button></div>
  <iframe id="yt" title="Reproductor de YouTube" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
</div>
<div id="log" aria-live="polite"></div>
<div id="interim"></div>

<form id="form" autocomplete="off">
  <button type="button" class="btn" id="mic" aria-pressed="false">Activar voz</button>
  <input type="text" id="text" placeholder="Escribe o activa la voz" aria-label="Mensaje">
  <button class="btn" type="submit">Enviar</button>
</form>
<div class="opts">
  <label><input type="checkbox" id="wake"> Solo si digo “Radex”</label>
  <label title="Dices “Radex” una vez para empezar y ya no hace falta repetirlo. Al terminar di “Radex, desactívate” y vuelve a dormir hasta que lo llames"><input type="checkbox" id="awake"> Modo conversación</label>
  <label title="Solo obedece lo que digas mientras mantienes pulsada la tecla Ctrl"><input type="checkbox" id="ptt"> Solo mientras mantengo Ctrl</label>
  <label title="Modo entrenado: ELIX solo hace lo que tú le enseñaste en «Órdenes → Añadir». No usa el cerebro, no necesita «Radex» y no hace caso a nada más."><input type="checkbox" id="strict"> Solo mis órdenes</label>
  <label title="Sin decir «Radex», solo hace caso a lo que parece una orden o a tus atajos. Ignora conversaciones, Zoom, tele…"><input type="checkbox" id="gate"> Solo órdenes que conozco</label>
  <label><input type="checkbox" id="mute"> Sin voz</label>
  <button type="button" class="mini" id="ordBtn" title="Ver lo que sabe hacer, lo que oyó, añadir frases nuevas y su memoria">Órdenes</button>
  <button type="button" class="mini" id="diagBtn" title="Comprobar permiso, elegir micrófono y probar que te entiende">Probar micrófono</button>
  <label>Avatar <select id="avatar" aria-label="Avatar"><option value="orbe">Orbe</option><option value="mujer">Holograma mujer</option><option value="hombre">Holograma hombre</option></select></label>
  <label>Oído <select id="earsel" aria-label="Motor de oído"><option value="auto">Automático</option><option value="groq">Groq Whisper (rápido)</option><option value="gemini">Gemini</option></select></label>
  <div id="apiCfg" style="display:none;gap:6px 18px;flex-wrap:wrap;align-items:center">
  <label>Cerebro
    <select id="prov" aria-label="Proveedor del cerebro">
      <option value="groq">Groq (gratis, recomendado)</option>
      <option value="openrouter">OpenRouter (gratis)</option>
      <option value="gemini">Gemini (gratis)</option>
      <option value="custom">Otro (compatible OpenAI)</option>
    </select>
  </label>
  <label>Clave <input type="password" id="key" placeholder="pega tu clave" autocomplete="off" aria-label="Clave de API" class="mini" style="width:150px"></label>
  <label>Modelo <input type="text" id="model" aria-label="Modelo" class="mini" style="width:150px"></label>
  <label id="urlRow" hidden>URL <input type="text" id="url" placeholder="http://localhost:11434/v1" aria-label="URL base" class="mini" style="width:200px"></label>
  <label id="kgroqRow" hidden>Clave Groq (oído) <input type="password" id="kgroq" placeholder="gsk_…" autocomplete="off" aria-label="Clave de Groq" class="mini" style="width:150px"></label>
  <label id="kgemRow" hidden>Clave Gemini (voz) <input type="password" id="kgem" placeholder="AIza…" autocomplete="off" aria-label="Clave de Gemini" class="mini" style="width:150px"></label>
  <span id="keyHelp" style="flex-basis:100%;font-size:14px"></span>
  </div>
  <label>Motor de voz <select id="tts" aria-label="Motor de voz"><option value="gemini">Gemini (natural)</option><option value="browser">Navegador</option></select></label>
  <label>Voz Gemini <select id="gvoice" aria-label="Voz de Gemini"><option>Kore</option><option>Aoede</option><option>Zephyr</option><option>Puck</option><option>Charon</option><option>Fenrir</option><option>Orus</option></select></label>
  <label>Voz del navegador <select id="voice" aria-label="Voz del navegador"></select></label>
  <label>Reproducir en <select id="ydest" aria-label="Dónde reproducir los videos"><option value="pagina">Esta página</option><option value="ventana">Pestaña nueva de YouTube</option></select></label>
  <label>Velocidad <input type="range" id="rate" min="0.8" max="1.3" step="0.05" value="1.05"></label>
</div>

<script>
/* =====================================================================
   Radex — versión web de pruebas
   Capas (pensadas para pasar a .exe sin reescribir):
   1) Oído/voz:   Web Speech (o dictation si corre dentro de Claude) + speechSynthesis
   2) Cerebro:    API compatible con OpenAI (Gemini gratis, Ollama, etc.); clave solo en tu navegador
   3) Acciones:   TOOLS_WEB (funcionan en el navegador) y TOOLS_NATIVE
                  (acciones de PC). En el .exe, window.jarvisNative las
                  implementa; en la web devuelven un aviso de "simulada".
   ===================================================================== */
const $ = (s) => document.querySelector(s);
const store = {
  get: (k, d) => { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
};
let history = [], listening = false, busy = false, speaking = false, sampler = null;

function setState(s, label) { document.body.dataset.state = s; $('#status').textContent = label; }
function addEl(cls, text, href) {

    if (!text || $('#mute').checked || !window.speechSynthesis) return resolve();
    speechSynthesis.cancel();
    const parts = (text.match(/[^.!?…]+[.!?…]*\s*/g) || [text]).map((p) => p.trim()).filter(Boolean);
    speaking = true; setState('speaking', 'Hablando');

      const u = new SpeechSynthesisUtterance(parts[i++]);

}

// Whisper a veces “inventa” frases cuando solo hay ruido: se descartan
const HALLU = /^(?:gracias(?: por (?:ver|mirar|escuchar)[^.]*)?|subt[ií]tulos?[^.]*|suscr[ií]bete[^.]*|amara\.org[^.]*|m[uú]sica|hasta (?:luego|pronto)|chao|adi[oó]s|nos vemos|y eso es todo|a+h+|e+h+|m{2,}|aj[aá]|[.,…\s-]+)\.?$/i;

// Groq Whisper: rápido (~0,3 s) y gratis. Se le pasa el idioma y la palabra “Radex” para que la reconozca mejor.
async function transcribeGroq(wav, lenient = false) {
  const key = keyOf('groq');
  if (!key) throw { message: 'Falta la clave de Groq para escuchar con Groq Whisper (gratis en console.groq.com/keys).' };
  let r;
  try {
    r = await apiFetch(PRESETS.groq.url + '/audio/transcriptions', {
      timeout: 15000, headers: { authorization: 'Bearer ' + key },
      form: {
        fields: { model: 'whisper-large-v3-turbo', language: 'es', temperature: '0', response_format: 'verbose_json',
          ...(lenient ? {} : { prompt: 'Radex.' }) }, // solo el nombre (no en sí/no: lo devolvía como respuesta): con frases de órdenes, Whisper las “inventaba” al oír música
        file: { bytes: wav, type: 'audio/wav', name: 'voz.wav' },
      },
    });
  } catch (e) {
    throw { message: e.name === 'AbortError' ? 'La transcripción de Groq tardó demasiado.' : 'No pude conectar con Groq para transcribir.', retry: true };
  }
  if (!r.ok) {
    const det = r.data?.error?.message || '';
    throw { retry: r.status !== 400, message: r.status === 401 ? 'La clave de Groq no es válida.'
      : r.status === 429 ? 'Groq llegó al límite gratuito de transcripción por ahora.' : `Error ${r.status} de Groq al transcribir. ${det}`.trim() };
  }
  const segs = r.data.segments || [];
  if (segs.length && (lenient ? segs.every((s) => s.no_speech_prob > 0.6) : segs.every((s) => s.no_speech_prob > 0.45 || s.avg_logprob < -0.9 || s.compression_ratio > 2.2))) return ''; // solo ruido, música o texto inventado
  const t = (r.data.text || '').trim();
  if (/^r[aeá]d[eé]\w{0,2}\W*$/i.test(t) && segs.some((s) => s.no_speech_prob > 0.2 || s.avg_logprob < -0.5)) return ''; // “Radex.” suelto y dudoso = eco del prompt
  if (!lenient && /^(?:r[aeá]d[eé]\w{0,2}[\s,.!¡¿?-]*){2,}$/i.test(t)) return ''; // “Radex, Radex.” = Whisper repitiendo el prompt al oír ruido; nadie llama así
  return t.length > 1 && !HALLU.test(t) ? t : '';
}

    r = await apiFetch(PRESETS.gemini.url + '/chat/completions', {

      body: JSON.stringify({

async function transcribe(wav, lenient = false) {
  const m = $('#earsel').value;
  const engines = m === 'groq' ? ['groq'] : m === 'gemini' ? ['gemini'] : [keyOf('groq') && 'groq', keyOf('gemini') && 'gemini'].filter(Boolean);
  if (!engines.length) throw { message: 'Para escuchar necesito una clave gratuita de Groq (console.groq.com/keys) o de Gemini. Pégala en el panel de API (doble clic en RADEX).' };
  const errs = [];
  for (const e of engines) {
    try { return e === 'groq' ? await transcribeGroq(wav, lenient) : await transcribeGemini(wav); }
    catch (err) { errs.push(err.message || 'Error al transcribir.'); if (!err.retry) break; }

async function gemFinish(chunks, sr, voiced = 1, ratio = 99) {
  const total = chunks.reduce((a, c) => a + c.length, 0);
  const sn = esperandoSN(); // esperando un sí/no: una palabra corta es válida

    hint('Ignoré una voz lejana o floja (nivel ' + ratio.toFixed(1) + '×; pido ' + MIC.far + '×). Si eras tú, habla más cerca o baja el filtro en «Probar micrófono».');
    setState('listening', listenLabel()); return;
  }
  GEM.working = true; setState('thinking', 'Transcribiendo');
  let text = '';
  try {
    const all = new Float32Array(total); let o = 0;
    for (const c of chunks) { all.set(c, o); o += c.length; }
    text = await transcribe(toWav(downsample(all, sr), 16000), sn);
  } catch (e) { addLine('error', e.message || 'No pude transcribir el audio.'); }
  GEM.working = false;
  if (text) onFinal(text);
  if (!busy && !speaking) setState('listening', listenLabel());
}

// Nivel de la voz (0..1) para que el holograma "hable": --lvl en <body>
let lvlAn = null, lvlBuf = null, lvlRaf = 0;
function voiceLevelOn(ctx, src) {
  try {
    lvlAn = lvlAn || Object.assign(ctx.createAnalyser(), { fftSize: 512, smoothingTimeConstant: 0.6 });

    src.connect(lvlAn);

    const tick = () => {
      lvlAn.getByteTimeDomainData(lvlBuf);
      let sum = 0; for (const v of lvlBuf) { const x = (v - 128) / 128; sum += x * x; }
      document.body.style.setProperty('--lvl', Math.min(1, Math.sqrt(sum / lvlBuf.length) * 5).toFixed(2));
      lvlRaf = requestAnimationFrame(tick);
    };
    tick();
    src.addEventListener('ended', () => { cancelAnimationFrame(lvlRaf); document.body.style.removeProperty('--lvl'); });
  } catch {}
}

// Partículas (puntos y ceros/unos) que suben alrededor del holograma; más rápidas al hablar o pensar
const FX = { ps: [], raf: 0, w: 0, h: 0 };
function fxKick() {
  cancelAnimationFrame(FX.raf);
  const cv = $('#holoFx'), on = document.body.dataset.avatar !== 'orbe' && !matchMedia('(prefers-reduced-motion:reduce)').matches;
  if (!on) return;
  const ctx = cv.getContext('2d'), dpr = Math.min(devicePixelRatio || 1, 2);
  const size = () => { const r = cv.getBoundingClientRect(); FX.w = r.width; FX.h = r.height; cv.width = r.width * dpr; cv.height = r.height * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); };
  size();
  const mk = (init) => ({ x: Math.random() * FX.w, y: init ? Math.random() * FX.h : FX.h * (0.75 + Math.random() * 0.25),
    v: 0.25 + Math.random() * 0.7, r: 0.8 + Math.random() * 1.8, a: 0.25 + Math.random() * 0.6, d: Math.random() < 0.3 ? (Math.random() < 0.5 ? '0' : '1') : '', ph: Math.random() * 6.28 });

  const frame = () => {
    const st = document.body.dataset.state, k = st === 'speaking' ? 2.2 : st === 'thinking' ? 3.2 : st === 'listening' ? 1.4 : 1;
    ctx.clearRect(0, 0, FX.w, FX.h); t += 0.02;

    FX.ps.forEach((p, i) => {

}

  try { window.open(url, '_blank', 'noopener,noreferrer'); } catch {}
  addEl('chip', 'Abrir: ' + label, url);
  return 'Enlace preparado. Si el navegador bloqueó la ventana, el usuario puede pulsar el enlace que aparece en pantalla.';
}

const YT = { list: [], i: 0, vol: 100, warned: false, ext: false };
const decodeHtml = (t) => { const x = document.createElement('textarea'); x.innerHTML = t; return x.value; };
function ytCmd(func, args = []) {
  try { $('#yt').contentWindow.postMessage(JSON.stringify({ event: 'command', func, args }), '*'); } catch {}
}
function ytPlay(i) {
  const v = YT.list[i]; if (!v) return false;
  YT.i = i; YT.vol = 100; YT.ext = false;
  $('#yt').src = 'https://www.youtube.com/embed/' + v.id + '?autoplay=1&playsinline=1&rel=0&enablejsapi=1&origin=' + encodeURIComponent(location.origin);
  $('#ptitle').textContent = v.title; $('#player').hidden = false; document.body.classList.add('playing');
  return true;
}
function ytClose() { $('#yt').src = 'about:blank'; $('#player').hidden = true; document.body.classList.remove('playing'); YT.list = []; YT.ext = false; }
$('#pclose').onclick = ytClose;
function ytOpenWindow(i) {
  const v = YT.list[i]; if (!v) return 'No hay más resultados.';
  YT.i = i; YT.ext = true;
  if (!$('#player').hidden) { $('#yt').src = 'about:blank'; $('#player').hidden = true; document.body.classList.remove('playing'); }
  const url = 'https://www.youtube.com/watch?v=' + v.id + '&autoplay=1';
  let w = null;
  try { w = window.open(url, '_blank'); if (w) w.opener = null; } catch {}
  addEl('chip', 'Abrir en YouTube: ' + v.title, url);
  return w
    ? `Abrí "${v.title}" de ${v.canal} en una pestaña nueva de YouTube.`
    : `El navegador bloqueó la ventana nueva. Dile al usuario que permita las ventanas emergentes de este sitio (icono en la barra de direcciones) o que pulse el enlace que apareció en pantalla para ver "${v.title}".`;
}
async function ytSearch(q) {
  const key = keyOf('gemini');
  if (!key) throw new Error('sin_clave');
  const r = await fetch('https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoEmbeddable=true&maxResults=5&q=' +
    encodeURIComponent(q) + '&key=' + encodeURIComponent(key));
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error('api_' + r.status + ' ' + (d.error?.message || ''));
  return (d.items || []).filter((x) => x.id?.videoId).map((x) => ({ id: x.id.videoId, title: decodeHtml(x.snippet.title), canal: decodeHtml(x.snippet.channelTitle) }));
}

      } catch (e) {

          YT.warned = true;
          addLine('error', 'Para reproducir videos dentro de Radex hay que activar “YouTube Data API v3” (gratis) en console.cloud.google.com, en el mismo proyecto de tu clave de AI Studio.');

      }

  { name: 'controlar_reproductor', description: 'Controla el video que se reproduce en esta página: pausar, reanudar, cerrar, siguiente, anterior, subir_volumen, bajar_volumen, establecer_volumen (con porcentaje), silenciar, activar_sonido. El volumen/silencio de aquí es SOLO del video: úsalo únicamente si el usuario dice “del video”, “de YouTube” o “de la canción”.',
    inputSchema: { type: 'object', properties: { accion: { type: 'string', enum: ['pausar', 'reanudar', 'cerrar', 'siguiente', 'anterior', 'subir_volumen', 'bajar_volumen', 'establecer_volumen', 'silenciar', 'activar_sonido'] }, porcentaje: { type: 'integer', description: 'Para establecer_volumen: 0-100. Para subir/bajar: cuántos puntos (por defecto 20).' } }, required: ['accion'] },
    execute: ({ accion, porcentaje }) => {
      if (YT.ext && YT.list.length) {
        if (accion === 'siguiente') return ytOpenWindow((YT.i + 1) % YT.list.length);
        if (accion === 'anterior') return ytOpenWindow((YT.i - 1 + YT.list.length) % YT.list.length);
        return 'El video está en otra pestaña de YouTube y desde aquí no puedo controlarlo (pausa, volumen). Solo puedo abrir el siguiente o el anterior.';
      }
      if ($('#player').hidden) return 'No hay ningún video reproduciéndose.';
      const go = (i) => { const n = YT.list.length; return n && ytPlay((i + n) % n) ? 'Reproduciendo: ' + YT.list[YT.i].title : 'No hay más resultados.'; };
      switch (accion) {
        case 'pausar': ytCmd('pauseVideo'); return 'Pausado.';
        case 'reanudar': ytCmd('playVideo'); return 'Reanudado.';
        case 'cerrar': ytClose(); return 'Reproductor cerrado.';
        case 'siguiente': return go(YT.i + 1);
        case 'anterior': return go(YT.i - 1);
        case 'establecer_volumen': { const n = parseInt(porcentaje, 10); if (!(n >= 0 && n <= 100)) return 'Dime un porcentaje entre 0 y 100.'; YT.vol = n; ytCmd('unMute'); ytCmd('setVolume', [n]); return 'Volumen del video al ' + n + '%'; }
        case 'subir_volumen': YT.vol = Math.min(100, YT.vol + (parseInt(porcentaje, 10) || 20)); ytCmd('setVolume', [YT.vol]); return 'Volumen del video: ' + YT.vol + '%';
        case 'bajar_volumen': YT.vol = Math.max(0, YT.vol - (parseInt(porcentaje, 10) || 20)); ytCmd('setVolume', [YT.vol]); return 'Volumen del video: ' + YT.vol + '%';
        case 'silenciar': ytCmd('mute'); return 'Video silenciado.';
        case 'activar_sonido': ytCmd('unMute'); return 'Sonido activado.';
      }
      return 'Acción desconocida.';
    } },
);

function classifyYesNo(t) {
  const w = String(t || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9 ]/g, ' ').split(/\s+/).filter(Boolean);
  if (!w.length || w.length > 6) return null;
  const yes = w.some((x) => YN_YES.has(x)), no = w.some((x) => YN_NO.has(x) && x !== 'mejor');
  if (yes && no) return null;
  if (yes && w.every((x) => YN_YES.has(x) || YN_FILL.has(x))) return 'yes';
  if (no && w.every((x) => YN_NO.has(x) || YN_FILL.has(x))) return 'no';
  return null;
}
// Si hay una acción esperando confirmación: consume lo pendiente y dice si el usuario respondió sí o no (o null si dijo otra cosa)
function esperandoSN() { return !!((pendingConfirm && Date.now() < pendingConfirm.exp + CONFIRM_GRACE_MS) || (pendingLearn && Date.now() < pendingLearn.exp)); }
function takePendingConfirm(text) {
  if (!pendingConfirm) return null;
  const p = pendingConfirm; pendingConfirm = null; lastPendingCand = p.cand || null;
  const now = Date.now();
  const k = now > p.exp + CONFIRM_GRACE_MS ? null : classifyYesNo(text);
  if (now > p.exp) { // venció: NUNCA se ejecuta; se cancela en el sistema y, si dijo sí, se le avisa
    try { window.elixTools.confirm(false); } catch {}
    if (k === 'yes') { lastExpired = p.resumen || ''; return 'expired'; }
    return k; // 'no' tardío: se cancela con normalidad; otra cosa: sigue la conversación normal
  }
  if (!k) { try { window.elixTools.confirm(false); } catch {} } // dijo otra cosa: se cancela
  return k;
}
async function resolveConfirm(yes) {
  setState('acting', 'Ejecutando');
  const r = await window.elixTools.confirm(yes);
  addEl('chip', 'confirmación ' + (yes ? 'aceptada' : 'rechazada') + ': ' + String((r && r.mensaje) || '').slice(0, 600));
  if (!r) return 'No obtuve respuesta del sistema.';
  if (r.expired) return 'Esa confirmación ya venció, así que no hice nada. Si todavía lo quieres, pídemelo otra vez.';
  if (r.none) return yes ? 'No tengo nada pendiente de confirmar.' : 'Vale, no hice nada.'; // p. ej. un “no” tardío: ya estaba cancelado
  if (r.cancelled) return 'Vale, lo cancelé. No hice nada.';
  if (!r.ok) return 'No pude hacerlo. ' + r.mensaje;
  confirmVerified = !!r.verified;
  return r.verified ? r.mensaje : r.mensaje + ' Ojo: no pude comprobar que haya quedado así.';
}

// Llamada a la API. En la app de escritorio la hace el proceso principal (sin CORS); en la web, el navegador.
const NET_HOSTS = /^https:\/\/(api\.groq\.com|openrouter\.ai|generativelanguage\.googleapis\.com|www\.googleapis\.com)\//;
async function apiFetch(url, { headers = {}, body, form, timeout = 25000, method = 'POST' } = {}) {
  if (window.elixNet && NET_HOSTS.test(url)) {
    const r = await window.elixNet.fetch({ url, method, headers, body, form, timeout });
    if (!r || r.status === 0) { const e = new Error((r && r.body) || 'sin conexión'); e.name = r && r.aborted ? 'AbortError' : 'NetError'; throw e; }
    let data = {}; try { data = JSON.parse(r.body); } catch {}
    return { ok: r.status >= 200 && r.status < 300, status: r.status, data };
  }
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), timeout);
  try {
    const init = { method, headers: { ...headers }, signal: ctl.signal };
    if (form) {
      const fd = new FormData();
      Object.entries(form.fields).forEach(([k, v]) => fd.append(k, v));
      fd.append('file', new Blob([form.file.bytes], { type: form.file.type }), form.file.name);
      init.body = fd;
    } else init.body = body;
    const r = await fetch(url, init);
    let data = {}; try { data = await r.json(); } catch {}
    return { ok: r.ok, status: r.status, data };
  } finally { clearTimeout(timer); }
}

async function askLLM(msgs, tools) {
  const c = cfg();
  const defs = tools.map((t) => {
    const props = t.inputSchema.properties || {};
    const fn = { name: t.name, description: t.description };
    if (Object.keys(props).length) {
      fn.parameters = { type: 'object', properties: props };
      if (t.inputSchema.required && t.inputSchema.required.length) fn.parameters.required = t.inputSchema.required;
    }
    return { type: 'function', function: fn };
  });
  const P = PRESETS[c.prov];
  let model = c.model;
  const fallbacks = P.fallbacks || [];
  const timeoutMs = c.prov === 'groq' ? 15000 : 25000;
  const wait = (ms) => new Promise((res) => setTimeout(res, ms));
  async function post(messages) {
    const order = [model, ...fallbacks.filter((x) => x !== model)];
    let last = { status: 0, detail: '' };
    for (const mdl of order) {
      const more = order.indexOf(mdl) < order.length - 1; // ¿queda otro modelo por probar?
      for (let attempt = 0; attempt < 2; attempt++) {
        const headers = { 'content-type': 'application/json' };
        if (c.key) headers.authorization = 'Bearer ' + c.key;
        const payload = { model: mdl, messages, tools: defs, max_tokens: c.prov === 'groq' ? 600 : 1200 };
        if (c.prov === 'groq' && /gpt-oss/.test(mdl)) payload.reasoning_effort = 'low'; // responde rápido, sin pensar de más
        let r;
        $('#status').textContent = 'Consultando ' + mdl;
        try {
          r = await apiFetch(c.base + '/chat/completions', { headers, body: JSON.stringify(payload), timeout: timeoutMs });
        } catch (e) {
          if (e.name === 'AbortError') { last = { status: 0, detail: 'timeout' }; break; }
          throw { message: 'No pude conectar con el proveedor. Revisa tu internet o la URL.' };
        }
        const d = r.data;
        if (r.ok) {
          if (mdl !== c.model && last.status === 404) { // el modelo elegido ya no existe: se guarda el que sí funciona
            $('#model').value = mdl; store.set('jarvis:model2:' + c.prov, mdl);
          }
          model = mdl; return d;
        }
        const info = { status: r.status, detail: (Array.isArray(d) ? d[0] : d)?.error?.message || '' };
        // Un 404 (modelo retirado) no tapa un error más útil de otro modelo (límite, saturación, timeout)
        if (r.status !== 404 || (!last.status && !last.detail)) last = info;
        // Fallo al armar la llamada a una herramienta: otro modelo suele acertar
        if (r.status === 400 && more && /tool|function/i.test(last.detail)) break;
        if ([400, 401, 403].includes(r.status)) throw { message: r.status === 401 ? `La clave de ${P.name} no es válida. Revísala en el panel de API (doble clic en RADEX).` : `Error ${r.status}. ${last.detail}`.trim() };
        if (r.status === 404) break; // modelo inexistente: probar el siguiente
        if (r.status === 429 && more) break; // límite de ese modelo: el siguiente tiene su propio cupo
        if (attempt === 1) break;
        $('#status').textContent = 'Reintentando…';
        await wait(1200 * (attempt + 1));
      }
    }
    if (last.detail === 'timeout')
      throw { message: `El modelo tardó más de ${timeoutMs / 1000} segundos en responder. Prueba otra vez o cambia el modelo en el campo “Modelo”.` };
    if (last.status === 503 || last.status === 429)
      throw { message: `${P.name} está saturado o llegaste al límite gratuito. Prueba de nuevo en un minuto, o cambia de proveedor en el panel de API (doble clic en RADEX).` };
    throw { message: `Error ${last.status} del proveedor. ${last.detail}`.trim() };
  }
  // La fecha va en el último mensaje del usuario (no en el sistema) para que el inicio de la petición no cambie y el proveedor pueda reutilizarlo
  const stamp = new Date().toLocaleString('es', { dateStyle: 'full', timeStyle: 'short' });
  const base = msgs.map((m) => ({ role: m.role, content: m.content }));
  for (let i = base.length - 1; i >= 0; i--) if (base[i].role === 'user') { base[i].content = `[${stamp}] ${base[i].content}`; break; }
  const messages = [{ role: 'system', content: instrucciones() }, ...base];
  const calls = []; // herramientas usadas en este turno (para poder aprender la orden)
  let saltados = 0; // pasos que no se ejecutaron porque uno anterior falló
  const fallaron = new Set(); // herramientas que fallaron en este turno: tras un fallo no se ejecuta ninguna otra acción (solo lecturas o reintentar la misma)
  const SOLO_LECTURA = /^(audio_en_uso|audio_estado|audio_silenciados|info_del_sistema)$/;
  for (let i = 0; i < 6; i++) {
    const d = await post(messages);
    const m = d.choices?.[0]?.message;
    if (!m) throw { message: 'El proveedor no devolvió respuesta.' };
    const { reasoning, reasoning_content, ...am } = m; // el razonamiento interno no se reenvía
    messages.push(am);
    if (!m.tool_calls || !m.tool_calls.length) return { text: (m.content || '').replace(/<think>[\s\S]*?<\/think>/gi, '').trim(), calls };
    let cortado = false; // varios pasos en una frase: se hacen en orden y, si uno no queda hecho y comprobado, NO se hacen los siguientes
    for (const call of m.tool_calls) {
      if (!cortado && fallaron.size && !fallaron.has(call.function.name) && !SOLO_LECTURA.test(call.function.name)) cortado = true;
      if (cortado) { saltados++; messages.push({ role: 'tool', tool_call_id: call.id, name: call.function.name, content: 'NO EJECUTADO: un paso anterior no quedó hecho y comprobado, así que este no se hizo. Díselo al usuario.' }); continue; }
      const t = tools.find((x) => x.name === call.function.name);
      let input = {};
      try { input = JSON.parse(call.function.arguments || '{}'); } catch {}
      let out;
      try { out = t ? await t.execute(input) : 'Herramienta desconocida'; } catch (e) { out = 'Error: ' + (e.message || e); }
      messages.push({ role: 'tool', tool_call_id: call.id, name: call.function.name, content: typeof out === 'string' ? out : JSON.stringify(out) });
      calls.push({ name: call.function.name, input, out: String(out) });
      if (!pasoCompletado(call.function.name, String(out))) { cortado = true; fallaron.add(call.function.name); } else fallaron.delete(call.function.name);
      if (/^(audio_|ajustar_volumen)/.test(call.function.name)) refrescarEstadoAudio();
    }
    // Cambios de audio y «qué tengo en uso»: la herramienta ya dice el resultado en una frase corta («Se ha cambiado a …»): se responde directo, sin otra llamada al cerebro
    // (también cuando fueron varios pasos seguidos: se dicen todos juntos)
    const directo = textoDirecto(calls, saltados);
    if (directo) return { text: directo, calls };
    // Una acción espera confirmación: se pregunta directo (sin otra llamada al cerebro: más rápido, sin gastar tokens y sin que se venza)
    if (pendingConfirm && pendingConfirm.ask) { pendingConfirm.ask = false; return { text: preguntaConfirmacion(pendingConfirm.resumen), calls, asked: true }; }
  }
  return { text: 'Me enredé con tantos pasos. ¿Lo intentamos de nuevo?', calls };
}

async function decir(reply) { // dice la respuesta y deja listas las ventanas de sí/no
  history = trim([...history, { role: 'assistant', content: reply }]);
  addLine('jarvis', reply);
  await speak(reply);
  ECHO.text = reply; ECHO.t = Date.now();
  // Si la respuesta era la pregunta de una confirmación: tiene 8 s desde que termina de hablar (nunca más del tope desde la orden)
  if (pendingConfirm && pendingConfirm.hard) pendingConfirm.exp = Math.min(pendingConfirm.hard, Date.now() + CONFIRM_ANSWER_MS);
  if (pendingLearn && pendingLearn.exp === Infinity) pendingLearn.exp = Date.now() + LEARN_ANSWER_MS;
}

async function send(text) {
  if (!text || busy) return;
  busy = true; ear.stop();
  if (speaking) stopSpeaking();
  addLine('user', text); setState('thinking', 'Pensando');
  history = trim([...history, { role: 'user', content: text }]);
  const turnStart = history.length;
  try {
    const yn = takePendingConfirm(text); // ¿está respondiendo a una confirmación pendiente?
    if (yn) {
      confirmVerified = false;
      let reply = yn === 'expired'
        ? (addEl('chip', 'confirmación vencida: no se hizo nada' + (lastExpired ? ' (' + lastExpired.slice(0, 200) + ')' : '')),
           'Esa confirmación ya venció, así que no hice nada' + (lastExpired ? ' (' + lastExpired.replace(/[.\s]+$/, '') + ')' : '') + '. Si todavía lo quieres, pídemelo otra vez.')
        : await resolveConfirm(yn === 'yes');
      // La orden era nueva, se confirmó y quedó verificada: se ofrece aprenderla
      if (yn === 'yes' && confirmVerified && lastPendingCand && ATAJOS.on) { const { f, t, a } = lastPendingCand; reply += ' ' + PREGUNTA_APRENDER; pendingLearn = { cand: { f, t, a }, exp: Infinity }; }
      confirmVerified = false; lastPendingCand = null;
      await decir(reply);
      return;
    }
    if (pendingLearn) { // ¿respondió a «¿aprendo esta orden?»
      const p = pendingLearn; pendingLearn = null;
      const k = classifyYesNo(text);
      if (k && Date.now() > p.exp) { history = history.slice(0, Math.max(0, turnStart - 1)); addEl('chip', 'ignoré un «sí/no» tardío'); return; }
      if (k) {
        ATAJOS.items.push({ ...p.cand, n: 0, c: Math.floor(Date.now() / 1000), ...(k === 'no' ? { r: 1 } : {}) });
        guardarAtajos();
        await decir(k === 'yes' ? 'Hecho, la aprendí. La próxima vez la hago al instante.' : 'Vale, no la guardo y no te lo vuelvo a preguntar.');
        return;
      }
    }
    const gest = gestionarAtajos(text); // «¿qué atajos tienes?» / «olvida el atajo …»
    if (gest) { logFrase(text, 'atajo', 'atajos'); await decir(gest); return; }
    // «Reactiva todo»: orden fija (no depende de que el cerebro elija bien la herramienta)
    if (REACTIVAR_RE.test(normText(text))) {
      const tr = REG_TOOLS.find((x) => x.name === 'audio_reactivar_todo');
      if (tr) {
        setState('acting', 'Ejecutando');
        let o; try { o = await tr.execute({}); } catch (e) { o = 'FALLÓ: ' + (e.message || e); }
        addEl('chip', 'audio_reactivar_todo: ' + String(o).slice(0, 600)); refrescarEstadoAudio();
        await decir(String(o).replace(/^(VERIFICADO|FALLÓ):\s*/, '').split('\n')[0].trim() || 'Listo.'); return;
      }
    }
    const hit = ATAJOS.on ? buscarAtajo(text) : null; // ¿ya la aprendí? se ejecuta sin gastar tokens
    if (hit && !hit.r) {
      const msg = await ejecutarAtajo(hit);
      if (msg) { logFrase(text, 'atajo', hit.t); await decir(msg); return; }
    }
    if (STRICT.on) { addEl('chip', 'modo «solo mis órdenes»: no hice nada con «' + text.slice(0, 80) + '» (añade la orden en Órdenes → Añadir)'); return; }
    const c = cfg();
    if (c.prov !== 'custom' && !c.key) throw { message: `Falta la clave gratuita de ${PRESETS[c.prov].name}. ${PRESETS[c.prov].help} Pégala en el campo “Clave” (doble clic en RADEX para mostrar la configuración de API).` };
    if (!c.base) throw { message: 'Escribe la URL del proveedor en el campo “URL”.' };
    const msgs = history;
    const tools = [...ALL_TOOLS, ...REG_TOOLS].map((t) => ({
      name: t.name, description: t.description, inputSchema: t.inputSchema,
      execute: async (input) => {
        setState('acting', 'Ejecutando');
        let out;
        try { out = await t.execute(input || {}); } catch (e) { out = 'Error: ' + (e.message || e); }
        const sim = t.native && !window.jarvisNative;
        addEl('chip' + (sim ? ' sim' : ''), `${t.name}${Object.keys(input || {}).length ? ' ' + JSON.stringify(input) : ''}: ${String(out).slice(0, 900)}`);
        return out;
      },
    }));
    const res = await askLLM(msgs, tools);
    let reply = (res.text || '').trim() || 'Listo.';
    if (esSilencio(reply, text)) { history = history.slice(0, Math.max(0, turnStart - 1)); addEl('chip', 'ignoré (no era para mí): «' + text.slice(0, 80) + '»'); logFrase(text, 'silencio'); return; }
    logFrase(text, 'cerebro', (res.calls || []).map((x) => x.name).join(', '));
    // Orden nueva que funcionó con una sola herramienta: se ofrece aprenderla (si pide confirmación, se ofrece cuando ya se confirmó y quedó verificada)
    const cand = candidatoAtajo(text, res.calls);
    if (cand && cand.r === 'pend') { if (pendingConfirm) pendingConfirm.cand = { f: cand.f, t: cand.t, a: cand.a }; }
    else if (cand) { reply += ' ' + PREGUNTA_APRENDER; pendingLearn = { cand: { f: cand.f, t: cand.t, a: cand.a }, exp: Infinity }; }
    await decir(reply);
  } catch (e) {
    history = history.slice(0, Math.max(0, turnStart - 1));
    const msg = e?.code === 'not_granted' ? 'Necesito tu permiso para usar a Claude como cerebro. Vuelve a intentarlo y acepta.'
      : e?.code === 'rate_limited' ? 'Demasiadas peticiones seguidas. Espera unos segundos.'
      : (e?.message || 'Error desconocido');
    addLine('error', msg);
    await speak('Algo falló. Mira el mensaje en pantalla.');
  } finally {
    busy = false; afterTurn(); refreshMemory();
  }
}

$('#form').onsubmit = (e) => {
  e.preventDefault();
  const t = $('#text').value.trim();
  $('#text').value = '';
  send(t);
};
